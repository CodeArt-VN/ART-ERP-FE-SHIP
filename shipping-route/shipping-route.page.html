<ion-header [translucent]="true">
	<app-toolbar [page]="this" [pageTitle]="'Shipping route' | translate" [ShowFeature]="false"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-name" name="Route name" property="Name" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-id" name="Number of customers" property="NumberOfCustomer" [canSort]="false" [canFilter]="false" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-code" name="Sales staff" property="SellerName">
				<ng-template let-i="row" datatable-cell-template>
					{{i.SellerName}}
					<a [routerLink]="['/staff/'+i.IDSeller]"> &nbsp;<ion-icon name="open-outline"></ion-icon> </a>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-code" name="Planned delivery" property="VehicleName" [canSort]="false" [canFilter]="false"></datatable-column>
			<datatable-column class="col-code" name="Code" property="Code" [navLink]="pageConfig.pageName"></datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
